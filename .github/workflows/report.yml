# TEMPORARY (PR #2 debugging): the dev sandbox cannot download
# Actions logs, so this workflow posts the full gate output as a
# PR comment. DELETE before marking the PR ready.
name: report
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  report:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Run gate capturing all output
        shell: bash
        run: |
          set +e
          R=report.txt
          : > "$R"
          echo '### cargo fmt --all -- --check' >> "$R"
          cargo fmt --all -- --check >> "$R" 2>&1
          echo "fmt exit: $?" >> "$R"
          echo '### cargo fmt --all (apply) + git diff' >> "$R"
          cargo fmt --all >> "$R" 2>&1
          git diff >> "$R" 2>&1
          echo '### cargo clippy --all-targets -- -D warnings' >> "$R"
          cargo clippy --all-targets -- -D warnings >> "$R" 2>&1
          echo "clippy exit: $?" >> "$R"
          echo '### cargo test --locked' >> "$R"
          cargo test --locked >> "$R" 2>&1
          echo "test exit: $?" >> "$R"
          echo '### cargo build --release --locked' >> "$R"
          cargo build --release --locked >> "$R" 2>&1
          echo "build exit: $?" >> "$R"
          wc -c "$R"
      - name: Post report as PR comment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYEOF'
          data = open('report.txt', encoding='utf-8', errors='replace').read()
          cap = 60000
          if len(data) > cap:
              data = data[:cap] + "\n...[truncated]\n"
          body = "<!-- gate-report -->\n**Gate report (temporary workflow)**\n\n<pre>\n" + data.replace('&','&amp;').replace('<','&lt;').replace('>','&gt;') + "\n</pre>\n"
          open('body.md','w',encoding='utf-8').write(body)
          print(len(body))
          PYEOF
          gh pr comment ${{ github.event.pull_request.number }} --body-file body.md
